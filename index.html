<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portefeuille de Compétences</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#140f13;--text:#f6efe6;--text-soft:#5a5752;--text-mid:#9a8e90;
  --line:#362f38;
  --spec:oklch(72% 0.19 150);--trans:oklch(68% 0.19 255);--soft:oklch(70% 0.22 10);
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;overflow-x:hidden;}
::selection{background:#362f38;color:var(--text);}

/* grain */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.35;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");
}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:290px;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:100;overflow-y:auto;}
.sb-head{padding:36px 26px 26px;border-bottom:1px solid var(--line);flex-shrink:0;}
.sb-head h1{font-family:'Lora',Georgia,serif;font-size:18px;font-weight:700;line-height:1.25;letter-spacing:-.02em;}
.cat-tabs{padding:16px 0;border-bottom:1px solid var(--line);flex-shrink:0;}
.cat-tab{display:flex;align-items:center;gap:12px;width:100%;padding:13px 26px;background:transparent;border:none;border-left:2px solid transparent;color:var(--text-soft);font-family:'Courier New',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-align:left;transition:color .2s,background .2s;}
.cat-tab .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:transform .2s;display:block;}
.cat-tab.spec .dot{background:var(--spec);}
.cat-tab.trans .dot{background:var(--trans);}
.cat-tab.soft .dot{background:var(--soft);}
.cat-tab:hover{color:var(--text);background:rgba(255,255,255,.03);}
.cat-tab.active{color:var(--text);}
.cat-tab.spec.active{border-left-color:var(--spec);}
.cat-tab.trans.active{border-left-color:var(--trans);}
.cat-tab.soft.active{border-left-color:var(--soft);}
.cat-tab.active .dot{transform:scale(1.4);}
.ac-list{flex:1;padding:14px 0;overflow-y:auto;}
.ac-item{display:flex;align-items:flex-start;gap:10px;width:100%;padding:13px 26px;background:transparent;border:none;border-left:2px solid transparent;color:var(--text-soft);font-family:Georgia,serif;font-size:12.5px;line-height:1.4;cursor:pointer;text-align:left;transition:color .2s,background .2s;}
.ac-item .ac-num{font-family:'Courier New',monospace;font-size:9.5px;letter-spacing:.06em;color:var(--text-soft);flex-shrink:0;margin-top:2px;min-width:56px;transition:color .2s;}
.ac-item:hover{color:var(--text);background:rgba(255,255,255,.03);}
.ac-item:hover .ac-num{color:var(--text-mid);}
.ac-item.active{color:var(--text);background:rgba(255,255,255,.05);}
.ac-item.active .ac-num{color:var(--text);}
.ac-item.spec.active{border-left-color:var(--spec);}
.ac-item.trans.active{border-left-color:var(--trans);}
.ac-item.soft.active{border-left-color:var(--soft);}
.ac-item.empty-ac{opacity:.35;}

/* MAIN */
.main{margin-left:290px;min-height:100vh;}
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:80px;}
.wl-eye{font-family:'Courier New',monospace;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-mid);margin-bottom:22px;}
.wl-title{font-family:'Lora',Georgia,serif;font-size:clamp(46px,5.5vw,78px);font-weight:700;line-height:1.01;letter-spacing:-.03em;margin-bottom:30px;}
.wl-title em{font-style:italic;color:var(--text-mid);}
.wl-sub{font-family:'Courier New',monospace;font-size:12.5px;color:var(--text-mid);max-width:380px;line-height:1.75;}
.wl-hint{margin-top:56px;font-family:'Courier New',monospace;font-size:10.5px;color:var(--line);letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:10px;}
.wl-hint::before{content:'';display:block;width:40px;height:1px;background:var(--line);}

.ac-view{display:none;flex-direction:column;min-height:100vh;}
.ac-view.visible{display:flex;}

/* GALLERY STORY (scroll-driven) */
.story{position:relative;}
.story-sticky{position:sticky;top:0;height:100vh;overflow:hidden;background:#0d0a0e;}
.story-slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;}
.story-slide.active{opacity:1;z-index:2;}
.story-slide img{width:100%;height:100%;object-fit:cover;display:block;}
.grad-bottom{position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(transparent,var(--bg));pointer-events:none;z-index:3;}
.grad-top{position:absolute;top:0;left:0;right:0;height:30%;background:linear-gradient(rgba(13,10,14,.6),transparent);pointer-events:none;z-index:3;}
.cine-bar-top{position:absolute;top:0;left:0;right:0;height:4vh;background:#000;z-index:4;pointer-events:none;}
.cine-bar-bot{position:absolute;bottom:0;left:0;right:0;height:4vh;background:#000;z-index:4;pointer-events:none;}
.story-overlay{position:absolute;top:calc(4vh + 24px);left:40px;z-index:5;}
.story-overlay .g-eye{font-family:'Courier New',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:8px;}
.g-badge{font-family:'Courier New',monospace;font-size:11.5px;padding:5px 12px;border-radius:20px;display:inline-block;}
.story-title{position:absolute;left:40px;right:100px;bottom:calc(4vh + 66px);z-index:5;}
.story-title h2{font-family:'Lora',Georgia,serif;font-size:clamp(24px,3vw,40px);font-weight:700;line-height:1.15;letter-spacing:-.02em;color:var(--text);max-width:760px;}
.progress-line{position:absolute;bottom:calc(4vh + 22px);left:40px;right:40px;height:2px;background:rgba(255,255,255,.15);z-index:5;}
.progress-line .fill{height:100%;background:#fff;width:0;transition:width .3s ease;}
.story-dots{position:absolute;bottom:calc(4vh + 34px);left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:5;}
.s-dot{width:6px;height:6px;border-radius:50%;border:none;padding:0;background:rgba(255,255,255,.2);cursor:pointer;transition:background .2s,transform .25s;}
.s-dot.active{background:#fff;transform:scale(1.35);}
.story-arrows{position:absolute;bottom:calc(4vh + 16px);right:30px;display:flex;gap:8px;z-index:5;}
.s-arr{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s;}
.s-arr:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);}

.gallery-empty{position:relative;height:68vh;min-height:360px;background:#0d0a0e;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.gallery-empty span{font-family:'Courier New',monospace;font-size:11px;color:var(--line);letter-spacing:.12em;text-transform:uppercase;}

/* BODY */
.ac-body{padding:0 80px 100px;}
.ac-title-block{padding:44px 0 52px;border-bottom:1px solid var(--line);}
.ac-title-block h2{font-family:'Lora',Georgia,serif;font-size:clamp(26px,3.2vw,42px);font-weight:700;line-height:1.18;letter-spacing:-.025em;max-width:680px;}
.chapter{display:grid;grid-template-columns:190px 1fr;gap:44px;align-items:start;padding:56px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease;}
.chapter.revealed{opacity:1;transform:translateY(0);}
.ch-label{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-mid);padding-top:5px;position:sticky;top:24px;}
.ch-content{font-size:16.5px;line-height:1.72;color:var(--text);}
.ch-content.empty{color:var(--text-soft);font-style:italic;}
.niv-pill{display:inline-flex;align-items:center;font-family:'Courier New',monospace;font-size:11.5px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:12px;}
.niv-pill.a{background:oklch(72% 0.19 150 / 0.18);color:oklch(86% 0.16 150);border:1px solid oklch(72% 0.19 150 / 0.32);}
.niv-pill.b{background:oklch(78% 0.16 80 / 0.18);color:oklch(88% 0.14 80);border:1px solid oklch(78% 0.16 80 / 0.32);}

.ac-footer{padding:44px 80px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);}
.foot-btn{font-family:'Courier New',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mid);background:none;border:1px solid var(--line);padding:11px 18px;cursor:pointer;border-radius:2px;transition:color .2s,border-color .2s;}
.foot-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2);}
.foot-btn:disabled{opacity:.15;pointer-events:none;}
.foot-count{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.1em;color:var(--text-mid);}

@media(max-width:920px){
  .sidebar{width:250px;}
  .main{margin-left:250px;}
  .welcome,.ac-body,.ac-footer{padding-left:36px;padding-right:36px;}
  .chapter{grid-template-columns:130px 1fr;gap:28px;}
}
@media(max-width:660px){
  .sidebar{position:static;width:100%;border-right:none;border-bottom:1px solid var(--line);height:auto;}
  .main{margin-left:0;}
  .story-sticky{height:70vh;}
  .chapter{grid-template-columns:1fr;gap:8px;}
  .ch-label{position:static;}
  .welcome,.ac-body,.ac-footer{padding-left:24px;padding-right:24px;}
  .story-overlay,.story-title{left:20px;}
}
@media(prefers-reduced-motion:reduce){
  .chapter,.story-slide{transition:none;}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-head"><h1>Portefeuille<br>de compétences</h1></div>
  <div class="cat-tabs" id="catTabs"></div>
  <div class="ac-list" id="acList"></div>
</aside>

<main class="main" id="main">
  <div class="welcome" id="welcome">
    <p class="wl-eye">Portefeuille de compétences</p>
    <h2 class="wl-title">Trois ans<br>de <em>pratique,</em><br>un dossier.</h2>
    <p class="wl-sub">Sélectionnez une compétence dans le menu, puis explorez chaque apprentissage critique à travers ses réalisations, ses preuves et ses axes de progression.</p>
    <p class="wl-hint">Choisir une compétence</p>
  </div>
  <div class="ac-view" id="acView"></div>
</main>

<script>
const DATA = [
  {
    id:"spec",cls:"spec",
    eyebrow:"Compétence de spécialité",
    title:"Développer un écosystème numérique complexe",
    acs:[
      {code:"AC33.01 & AC33.02",titre:"Développer avec un framework client et serveur",realisation:"",ma_part:"",justification:"",argumentation:"",niveau_lettre:"",photos:["AC3301_1","AC3301_2","AC3301_3","AC3301_4","AC3301_5"]},
      {code:"AC33.03",titre:"Développer des dispositifs interactifs sophistiqués",realisation:"Unity — Jeu Endless Runner 3D",ma_part:"Développement complet du jeu en autonomie.",justification:"Le jeu intègre boucle de jeu, niveaux progressifs, gestion des collisions, score en temps réel et animations — le tout en C#. Un dispositif interactif complet, de A à Z.",argumentation:"Niveau A. Jeu fonctionnel et jouable. Le manque de temps a limité le polish visuel. À améliorer : les transitions entre niveaux et la sauvegarde du score.",niveau_lettre:"A",photos:["AC3303_1","AC3303_2","AC3303_3","AC3303_4","AC3303_5"]},
      {code:"AC33.04",titre:"Concevoir et développer des composants logiciels, plugins ou extensions",realisation:"Application Flutter — Itinéraire",ma_part:"Développement de l'application de bout en bout.",justification:"L'app intègre des plugins (cartes, géolocalisation, stockage) et des composants réutilisables — illustrations directes de l'AC.",argumentation:"Niveau A. Application parfaitement fonctionnelle. À approfondir : la gestion d'état (BLoC/Provider) et les tests unitaires.",niveau_lettre:"A",photos:["AC3304_1","AC3304_2","AC3304_3","AC3304_4","AC3304_5"]},
      {code:"AC33.05",titre:"Maîtriser l'hébergement et le déploiement d'applications",realisation:"Hébergement Docker — conteneurisation sous Linux",ma_part:"Mise en place des conteneurs et configuration du serveur Linux.",justification:"Dockerfiles, Docker Compose, orchestration multi-conteneurs (app, base de données, reverse proxy), le tout administré sur un serveur Linux.",argumentation:"Compétence entièrement nouvelle : Docker et Linux appris en parallèle. Réussir à faire tourner la stack complète est une vraie satisfaction. À viser : CI/CD et Kubernetes.",niveau_lettre:"",photos:["AC3305_1","AC3305_2","AC3305_3","AC3305_4","AC3305_5"]}
    ]
  },
  {
    id:"trans",cls:"trans",
    eyebrow:"Compétence transversale",
    title:"Entreprendre dans le secteur du numérique",
    acs:[
      {code:"AC35.01",titre:"Piloter un produit, un service ou une équipe",realisation:"Projet Entrepreneuriat — pilotage d'équipe",ma_part:"Répartition des tâches, suivi de l'avancement, arbitrage des décisions.",justification:"J'ai coordonné l'équipe sur l'ensemble du projet : priorités, attribution des tâches selon les compétences, maintien de la cohésion vers l'objectif.",argumentation:"Niveau A. Le pilotage a bien fonctionné. À améliorer : formaliser le suivi avec des comptes-rendus et un tableau de bord partagé.",niveau_lettre:"A",photos:["AC3501_1","AC3501_2","AC3501_3","AC3501_4","AC3501_5"]},
      {code:"AC35.02",titre:"Maîtriser la qualité en projet Web ou multimédia",realisation:"Management",ma_part:"",justification:"",argumentation:"",niveau_lettre:"",photos:["AC3502_1","AC3502_2","AC3502_3","AC3502_4","AC3502_5"]},
      {code:"AC35.03",titre:"Concevoir un projet d'entreprise innovante",realisation:"Entreprise de location de matériel multimédia",ma_part:"Co-conception : nom, statut juridique, identité visuelle, offre et ton de la marque.",justification:"Tous les critères couverts : statut SAS, identité visuelle, offre de services et ton ciblant les créateurs de contenu.",argumentation:"Niveau B. Projet complet mais perfectible. Répartition déséquilibrée et volet financement trop léger. À travailler : un vrai prévisionnel chiffré.",niveau_lettre:"B",photos:["AC3503_1","AC3503_2","AC3503_3","AC3503_4","AC3503_5"]},
      {code:"C35.04",titre:"Défendre un projet de manière convaincante",realisation:"Soutenance — projet Nach !",ma_part:"Apport d'idées, construction de l'argumentaire et prise de parole devant jury.",justification:"Structuration de la présentation et réponse aux questions critiques du jury, en défendant nos choix avec des arguments concrets.",argumentation:"Exercice exigeant et enrichissant. À améliorer : la fluidité à l'oral sans support et la gestion des questions imprévues.",niveau_lettre:"",photos:["C3504_1","C3504_2","C3504_3","C3504_4","C3504_5"]}
    ]
  },
  {
    id:"soft",cls:"soft",
    eyebrow:"Compétences métiers & soft skills",
    title:"Savoir-être en entreprise",
    acs:[
      {code:"Équipe",titre:"Travail d'équipe",realisation:"Rapport d'activités 2025",ma_part:"Coordination avec les conseillers, mise en page et rédaction.",justification:"Collecte d'informations auprès de plusieurs interlocuteurs, intégration de leurs retours en continu, respect d'un calendrier contraint.",argumentation:"J'ai appris l'importance des points d'étape réguliers. Reformuler des infos techniques pour un document grand public a été un vrai exercice.",niveau_lettre:"",photos:["EQUIPE_1","EQUIPE_2","EQUIPE_3","EQUIPE_4","EQUIPE_5"]},
      {code:"Polyvalence",titre:"Polyvalence",realisation:"Communication digitale + développement du site web",ma_part:"Création des visuels, gestion des réseaux sociaux, développement et mise en ligne du site.",justification:"Alternance entre création graphique, rédaction et développement web complet — trois registres très différents gérés en parallèle.",argumentation:"Jongler entre les registres m'a appris à prioriser. L'axe de progression : approfondir chaque domaine (SEO, motion design, performance web) plutôt que rester en surface.",niveau_lettre:"",photos:["POLY_1","POLY_2","POLY_3","POLY_4","POLY_5"]}
    ]
  }
];

let activeCat=0, activeAc=null, galleryIndex=0;

function getCat(){return DATA[activeCat];}
function getAc(){return activeAc!=null ? getCat().acs[activeAc] : null;}

function renderSidebar(){
  const tabs=document.getElementById('catTabs');
  tabs.innerHTML=DATA.map((c,i)=>`
    <button class="cat-tab ${c.cls} ${i===activeCat?'active':''}" data-c="${i}">
      <span class="dot"></span>${c.eyebrow}
    </button>`).join('');
  tabs.querySelectorAll('.cat-tab').forEach(b=>b.addEventListener('click',()=>{
    activeCat=+b.dataset.c;activeAc=null;galleryIndex=0;render();
  }));

  const list=document.getElementById('acList');
  const cat=getCat();
  list.innerHTML=cat.acs.map((a,i)=>{
    const empty=!a.realisation&&!a.justification;
    return `<button class="ac-item ${cat.cls} ${i===activeAc?'active':''} ${empty?'empty-ac':''}" data-a="${i}">
      <span class="ac-num">${a.code}</span>${a.titre}
    </button>`;
  }).join('');
  list.querySelectorAll('.ac-item').forEach(b=>b.addEventListener('click',()=>{
    activeAc=+b.dataset.a;galleryIndex=0;render();window.scrollTo(0,0);
  }));
}

function renderView(){
  const welcome=document.getElementById('welcome');
  const view=document.getElementById('acView');
  const cat=getCat();
  const ac=getAc();

  if(!ac){welcome.style.display='flex';view.classList.remove('visible');view.innerHTML='';return;}
  welcome.style.display='none';
  view.classList.add('visible');

  const photos=ac.photos||[];
  const hasPhotos=photos.length>0;
  const clsColor=cat.cls;

  // gallery / story
  let galleryHtml='';
  if(hasPhotos){
    const slides=photos.map((name,i)=>`
      <div class="story-slide ${i===0?'active':''}" data-slide="${i}">
        <img src="images/${name}.png" alt="${name}">
      </div>`).join('');
    const dots=photos.length>1?photos.map((_,i)=>`<button class="s-dot ${i===0?'active':''}" data-dot="${i}"></button>`).join(''):'';
    const arrows=photos.length>1?`
      <div class="story-arrows">
        <button class="s-arr" id="arrPrev">&#8592;</button>
        <button class="s-arr" id="arrNext">&#8594;</button>
      </div>`:'';
    const progress=photos.length>1?`<div class="progress-line"><div class="fill" id="progFill"></div></div>`:'';
    galleryHtml=`
      <div class="story" id="story" style="height:${photos.length*100}vh;">
        <div class="story-sticky">
          ${slides}
          <div class="grad-top"></div><div class="grad-bottom"></div>
          <div class="cine-bar-top"></div><div class="cine-bar-bot"></div>
          <div class="story-overlay">
            <p class="g-eye">${cat.eyebrow}</p>
            <span class="g-badge" style="background:${badgeBg(clsColor)};color:${badgeColor(clsColor)};border:1px solid ${badgeBorder(clsColor)};">${ac.code}</span>
          </div>
          <div class="story-title"><h2>${ac.titre}</h2></div>
          ${progress}${dots?`<div class="story-dots">${dots}</div>`:''}${arrows}
        </div>
      </div>`;
  } else {
    galleryHtml=`<div class="gallery-empty"><span>Aucune illustration disponible</span></div>`;
  }

  // chapters
  const rawFields=[
    {label:"Réalisation choisie",value:ac.realisation},
    {label:"Ma part dans le travail",value:ac.ma_part},
    {label:"En quoi cela illustre l'AC",value:ac.justification},
    {label:"Niveau atteint & progression",value:ac.argumentation,niveau:ac.niveau_lettre}
  ].filter(f=>f.label!=="Ma part dans le travail"||f.value);

  const chapters=rawFields.map((f,i)=>{
    const niv=f.niveau?`<div class="niv-pill ${f.niveau.toLowerCase()}">Niveau ${f.niveau}</div>`:'';
    return `<div class="chapter" style="transition-delay:${i*80}ms">
      <div class="ch-label">${f.label}</div>
      <div class="ch-content ${!f.value?'empty':''}">${niv}${niv?'<br>':''}${f.value||'À compléter prochainement.'}</div>
    </div>`;
  }).join('');

  const total=cat.acs.length;
  view.innerHTML=`
    ${galleryHtml}
    <div class="ac-body">
      <div class="ac-title-block"><h2>${ac.titre}</h2></div>
      ${chapters}
    </div>
    <div class="ac-footer">
      <button class="foot-btn" id="footPrev" ${activeAc===0?'disabled':''}>← Précédent</button>
      <span class="foot-count">${activeAc+1} / ${total}</span>
      <button class="foot-btn" id="footNext" ${activeAc===total-1?'disabled':''}>Suivant →</button>
    </div>`;

  // footer nav
  const fp=document.getElementById('footPrev'), fn=document.getElementById('footNext');
  if(fp)fp.onclick=()=>{if(activeAc>0){activeAc--;galleryIndex=0;render();window.scrollTo(0,0);}};
  if(fn)fn.onclick=()=>{if(activeAc<total-1){activeAc++;galleryIndex=0;render();window.scrollTo(0,0);}};

  // gallery controls
  if(hasPhotos&&photos.length>1){
    document.getElementById('arrPrev').onclick=()=>jumpImage(galleryIndex-1);
    document.getElementById('arrNext').onclick=()=>jumpImage(galleryIndex+1);
    view.querySelectorAll('.s-dot').forEach(d=>d.onclick=()=>jumpImage(+d.dataset.dot));
  }

  setupObserver();
  updateGallery();
}

function badgeBg(c){return c==='spec'?'oklch(72% 0.19 150 / 0.22)':c==='trans'?'oklch(68% 0.19 255 / 0.24)':'oklch(70% 0.22 10 / 0.22)';}
function badgeColor(c){return c==='spec'?'oklch(86% 0.16 150)':c==='trans'?'oklch(82% 0.14 255)':'oklch(84% 0.17 10)';}
function badgeBorder(c){return c==='spec'?'oklch(72% 0.19 150 / 0.4)':c==='trans'?'oklch(68% 0.19 255 / 0.4)':'oklch(70% 0.22 10 / 0.4)';}

function jumpImage(i){
  const ac=getAc();if(!ac)return;
  const photos=ac.photos||[];
  const total=photos.length;
  i=Math.max(0,Math.min(total-1,i));
  const story=document.getElementById('story');
  if(!story||total<2){galleryIndex=i;updateGallery();return;}
  const rect=story.getBoundingClientRect();
  const scrollable=rect.height-window.innerHeight;
  const targetY=window.scrollY+rect.top+(i/total)*scrollable+4;
  window.scrollTo({top:Math.max(0,targetY),behavior:'smooth'});
}

function updateGallery(){
  const ac=getAc();if(!ac)return;
  const photos=ac.photos||[];
  document.querySelectorAll('.story-slide').forEach((s,i)=>s.classList.toggle('active',i===galleryIndex));
  document.querySelectorAll('.s-dot').forEach((d,i)=>d.classList.toggle('active',i===galleryIndex));
  const fill=document.getElementById('progFill');
  if(fill&&photos.length>1)fill.style.width=((galleryIndex+1)/photos.length*100)+'%';
}

let observer=null;
function setupObserver(){
  if(observer)observer.disconnect();
  observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('revealed');});
  },{threshold:.15});
  document.querySelectorAll('.chapter').forEach(ch=>observer.observe(ch));
}

function onScroll(){
  const ac=getAc();if(!ac)return;
  const photos=ac.photos||[];
  if(photos.length<2)return;
  const story=document.getElementById('story');
  if(!story)return;
  const rect=story.getBoundingClientRect();
  const scrollable=rect.height-window.innerHeight;
  if(scrollable<=0)return;
  let p=(-rect.top)/scrollable;
  p=Math.max(0,Math.min(0.9999,p));
  const idx=Math.max(0,Math.min(photos.length-1,Math.floor(p*photos.length)));
  if(idx!==galleryIndex){galleryIndex=idx;updateGallery();}
}
window.addEventListener('scroll',onScroll,{passive:true});

function render(){renderSidebar();renderView();}
render();
</script>
</body>
</html>
