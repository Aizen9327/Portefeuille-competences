document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 <div style=\"position:sticky;top:0;height:100vh;overflow:hidden;background:#0d0a0e;\">\n              <sc-for list=\"{{photos}}\" as=\"photo\" hint-placeholder-count=\"3\">\n                <div style=\"position:absolute;inset:0;opacity:{{photo.opacity}};z-index:{{photo.z}};transition:opacity .7s ease;\">\n                  <img src=\"{{photo.src}}\" alt=\"{{photo.placeholderLabel}}\" style=\"width:100%;height:100%;object-fit:contain;object-position:center;display:block;image-rendering:auto;\">\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(transparent,#140f13);pointer-events:none;z-index:2;\"><\u002Fdiv>\n              <div style=\"position:absolute;top:0;left:0;right:0;height:30%;background:linear-gradient(rgba(13,10,14,.6),transparent);pointer-events:none;z-index:2;\"><\u002Fdiv>\n              <div style=\"position:absolute;top:0;left:0;right:0;height:4vh;background:#000;z-index:4;pointer-events:none;\"><\u002Fdiv>\n              <div style=\"position:absolute;bottom:0;left:0;right:0;height:4vh;background:#000;z-index:4;pointer-events:none;\"><\u002Fdiv>\n\n              <div style=\"position:absolute;top:calc(4vh + 24px);left:40px;z-index:5;\">\n                <p style=\"font-family:'IBM Plex Sans',sans-serif;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);margin:0 0 8px;\">{{catEyebrow}}<\u002Fp>\n                <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;padding:5px 12px;border-radius:20px;display:inline-block;background:{{badgeBg}};color:{{badgeColor}};border:1px solid {{badgeBorder}};\">{{catBadgeText}}<\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"position:absolute;left:40px;right:100px;bottom:calc(4vh + 66px);z-index:5;\">\n                <h2 style=\"font-family:'Lora',serif;font-size:clamp(24px,3vw,40px);font-weight:700;line-height:1.15;letter-spacing:-.02em;color:#f6efe6;max-width:760px;margin:0;\">{{acTitre}}<\u002Fh2>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{hasMultiple}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"position:absolute;bottom:calc(4vh + 22px);left:40px;right:40px;height:2px;background:rgba(255,255,255,.15);z-index:5;\">\n                  <div style=\"height:100%;background:#fff;width:{{progressPct}}%;transition:width .3s ease;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"position:absolute;bottom:calc(4vh + 34px);left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:5;\">\n                  <sc-for list=\"{{photos}}\" as=\"photo\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{photo.onJump}}\" style=\"width:6px;height:6px;border-radius:50%;border:none;padding:0;background:{{photo.dotColor}};cursor:pointer;transition:background .2s,transform .25s;transform:{{photo.dotScale}};\"><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"position:absolute;bottom:calc(4vh + 16px);right:30px;display:flex;gap:8px;z-index:5;\">\n                  <button sc-camel-on-click=\"{{prevImage}}\" style=\"width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);color:#f6efe6;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s;\" style-hover=\"background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);\">←<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{nextImage}}\" style=\"width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);color:#f6efe6;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s;\" style-hover=\"background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);\">→<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{hasEmptyGallery}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"position:relative;height:68vh;min-height:360px;background:#0d0a0e;display:flex;align-items:center;justify-content:center;flex-shrink:0;\">\n            <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:#362f38;letter-spacing:.12em;text-transform:uppercase;\">Aucune illustration disponible<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"padding:0 80px 100px;\">\n          <div style=\"padding:44px 0 52px;border-bottom:1px solid #362f38;\">\n            <h2 style=\"font-family:'Lora',serif;font-size:clamp(26px,3.2vw,42px);font-weight:700;line-height:1.18;letter-spacing:-.025em;max-width:680px;margin:0;\">{{acTitre}}<\u002Fh2>\n          <\u002Fdiv>\n          <sc-for list=\"{{fields}}\" as=\"f\" hint-placeholder-count=\"3\">\n            <div ref=\"{{f.refFn}}\" style=\"display:grid;grid-template-columns:190px 1fr;gap:44px;align-items:start;padding:56px 0;border-bottom:1px solid #362f38;opacity:{{f.opacity}};transform:{{f.transform}};transition:opacity .7s ease {{f.delay}}ms,transform .7s ease {{f.delay}}ms;\">\n              <div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9a8e90;padding-top:5px;position:sticky;top:24px;\">{{f.label}}<\u002Fdiv>\n              <div style=\"font-size:16.5px;line-height:1.72;color:{{f.textColor}};font-style:{{f.fontStyle}};\">\n                <sc-if value=\"{{f.hasNiveau}}\" hint-placeholder-val=\"{{false}}\">\n                  <div style=\"display:inline-flex;align-items:center;font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:12px;background:{{f.niveauBg}};color:{{f.niveauColor}};border:1px solid {{f.niveauBorder}};\">Niveau {{f.niveau}}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div>{{f.displayValue}}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"padding:44px 80px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #362f38;\">\n          <button sc-camel-on-click=\"{{prevAc}}\" style=\"font-family:'IBM Plex Sans',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#9a8e90;background:none;border:1px solid #362f38;padding:11px 18px;cursor:pointer;border-radius:2px;opacity:{{prevOpacity}};pointer-events:{{prevPointer}};transition:color .2s,border-color .2s;\" style-hover=\"color:#f6efe6;border-color:rgba(255,255,255,.2);\">← Précédent<\u002Fbutton>\n          <span style=\"font-family:'IBM Plex Sans',sans-serif;font-size:10px;letter-spacing:.1em;color:#9a8e90;\">{{footCount}}<\u002Fspan>\n          <button sc-camel-on-click=\"{{nextAc}}\" style=\"font-family:'IBM Plex Sans',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#9a8e90;background:none;border:1px solid #362f38;padding:11px 18px;cursor:pointer;border-radius:2px;opacity:{{nextOpacity}};pointer-events:{{nextPointer}};transition:color .2s,border-color .2s;\" style-hover=\"color:#f6efe6;border-color:rgba(255,255,255,.2);\">Suivant →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  static DATA = [\n    {\n      id:\"spec\",cls:\"spec\",\n      eyebrow:\"Compétence de spécialité\",\n      title:\"Développer un écosystème numérique complexe\",\n      acs:[\n        {code:\"AC33.01\",titre:\"Développer à l'aide d'un framework de développement côté client\",realisation:\"\",ma_part:\"\",justification:\"\",argumentation:\"\",photos:[]},\n        {code:\"AC33.02\",titre:\"Développer à l'aide d'un framework de développement côté serveur\",realisation:\"\",ma_part:\"\",justification:\"\",argumentation:\"\",photos:[]},\n        {code:\"AC33.03\",titre:\"Développer des dispositifs interactifs sophistiqués\",realisation:\"Unity — Jeu Endless Runner 3D\",ma_part:\"Développement complet du jeu en autonomie.\",justification:\"Le jeu intègre boucle de jeu, niveaux progressifs, gestion des collisions, score en temps réel et animations — le tout en C#. Un dispositif interactif complet, de A à Z.\",argumentation:\"Niveau A. Jeu fonctionnel et jouable. Le manque de temps a limité le polish visuel. À améliorer : les transitions entre niveaux et la sauvegarde du score.\",niveau_lettre:\"A\",photos:[\"AC3303_1\",\"AC3303_2\",\"AC3303_3\",\"AC3303_4\",\"AC3303_5\"]},\n        {code:\"AC33.04\",titre:\"Concevoir et développer des composants logiciels, plugins ou extensions\",realisation:\"Application Flutter — Itinéraire\",ma_part:\"Développement de l'application de bout en bout.\",justification:\"L'app intègre des plugins (cartes, géolocalisation, stockage) et des composants réutilisables — illustrations directes de l'AC.\",argumentation:\"Niveau A. Application parfaitement fonctionnelle. À approfondir : la gestion d'état (BLoC/Provider) et les tests unitaires.\",niveau_lettre:\"A\",photos:[\"AC3304_1\",\"AC3304_2\",\"AC3304_3\",\"AC3304_4\",\"AC3304_5\"]},\n        {code:\"AC33.05\",titre:\"Maîtriser l'hébergement et le déploiement d'applications\",realisation:\"Hébergement Docker — conteneurisation sous Linux\",ma_part:\"Mise en place des conteneurs et configuration du serveur Linux.\",justification:\"Dockerfiles, Docker Compose, orchestration multi-conteneurs (app, base de données, reverse proxy), le tout administré sur un serveur Linux.\",argumentation:\"Compétence entièrement nouvelle : Docker et Linux appris en parallèle. Réussir à faire tourner la stack complète est une vraie satisfaction. À viser : CI/CD et Kubernetes.\",niveau_lettre:\"\",photos:[\"AC3305_1\",\"AC3305_2\",\"AC3305_3\",\"AC3305_4\",\"AC3305_5\"]}\n      ]\n    },\n    {\n      id:\"trans\",cls:\"trans\",\n      eyebrow:\"Compétence transversale\",\n      title:\"Entreprendre dans le secteur du numérique\",\n      acs:[\n        {code:\"AC35.01\",titre:\"Piloter un produit, un service ou une équipe\",realisation:\"Projet Entrepreneuriat — pilotage d'équipe\",ma_part:\"Répartition des tâches, suivi de l'avancement, arbitrage des décisions.\",justification:\"J'ai coordonné l'équipe sur l'ensemble du projet : priorités, attribution des tâches selon les compétences, maintien de la cohésion vers l'objectif.\",argumentation:\"Niveau A. Le pilotage a bien fonctionné. À améliorer : formaliser le suivi avec des comptes-rendus et un tableau de bord partagé.\",niveau_lettre:\"A\",photos:[\"AC3501_1\",\"AC3501_2\",\"AC3501_3\",\"AC3501_4\",\"AC3501_5\"]},\n        {code:\"AC35.02\",titre:\"Maîtriser la qualité en projet Web ou multimédia\",realisation:\"Management\",ma_part:\"\",justification:\"\",argumentation:\"\",photos:[\"AC3502_1\",\"AC3502_2\",\"AC3502_3\",\"AC3502_4\",\"AC3502_5\"]},\n        {code:\"AC35.03\",titre:\"Concevoir un projet d'entreprise innovante\",realisation:\"Entreprise de location de matériel multimédia\",ma_part:\"Co-conception : nom, statut juridique, identité visuelle, offre et ton de la marque.\",justification:\"Tous les critères couverts : statut SAS, identité visuelle, offre de services et ton ciblant les créateurs de contenu.\",argumentation:\"Niveau B. Projet complet mais perfectible. Répartition déséquilibrée et volet financement trop léger. À travailler : un vrai prévisionnel chiffré.\",niveau_lettre:\"B\",photos:[\"AC3503_1\",\"AC3503_2\",\"AC3503_3\",\"AC3503_4\",\"AC3503_5\"]},\n        {code:\"C35.04\",titre:\"Défendre un projet de manière convaincante\",realisation:\"Soutenance — projet Nach !\",ma_part:\"Apport d'idées, construction de l'argumentaire et prise de parole devant jury.\",justification:\"Structuration de la présentation et réponse aux questions critiques du jury, en défendant nos choix avec des arguments concrets.\",argumentation:\"Exercice exigeant et enrichissant. À améliorer : la fluidité à l'oral sans support et la gestion des questions imprévues.\",niveau_lettre:\"\",photos:[\"C3504_1\",\"C3504_2\",\"C3504_3\",\"C3504_4\",\"C3504_5\"]}\n      ]\n    },\n    {\n      id:\"soft\",cls:\"soft\",\n      eyebrow:\"Compétences métiers & soft skills\",\n      title:\"Savoir-être en entreprise\",\n      acs:[\n        {code:\"Équipe\",titre:\"Travail d'équipe\",realisation:\"Rapport d'activités 2025\",ma_part:\"Coordination avec les conseillers, mise en page et rédaction.\",justification:\"Collecte d'informations auprès de plusieurs interlocuteurs, intégration de leurs retours en continu, respect d'un calendrier contraint.\",argumentation:\"J'ai appris l'importance des points d'étape réguliers. Reformuler des infos techniques pour un document grand public a été un vrai exercice.\",niveau_lettre:\"\",photos:[\"EQUIPE_1\",\"EQUIPE_2\",\"EQUIPE_3\",\"EQUIPE_4\",\"EQUIPE_5\"]},\n        {code:\"Polyvalence\",titre:\"Polyvalence\",realisation:\"Communication digitale + développement du site web\",ma_part:\"Création des visuels, gestion des réseaux sociaux, développement et mise en ligne du site.\",justification:\"Alternance entre création graphique, rédaction et développement web complet — trois registres très différents gérés en parallèle.\",argumentation:\"Jongler entre les registres m'a appris à prioriser. L'axe de progression : approfondir chaque domaine (SEO, motion design, performance web) plutôt que rester en surface.\",niveau_lettre:\"\",photos:[\"POLY_1\",\"POLY_2\",\"POLY_3\",\"POLY_4\",\"POLY_5\"]}\n      ]\n    }\n  ];\n\n  static CLS_COLORS = {\n    spec:{dot:\"oklch(72% 0.19 150)\",badgeBg:\"oklch(72% 0.19 150 / 0.22)\",badgeColor:\"oklch(86% 0.16 150)\",badgeBorder:\"oklch(72% 0.19 150 / 0.4)\"},\n    trans:{dot:\"oklch(68% 0.19 255)\",badgeBg:\"oklch(68% 0.19 255 / 0.24)\",badgeColor:\"oklch(82% 0.14 255)\",badgeBorder:\"oklch(68% 0.19 255 / 0.4)\"},\n    soft:{dot:\"oklch(70% 0.22 10)\",badgeBg:\"oklch(70% 0.22 10 / 0.22)\",badgeColor:\"oklch(84% 0.17 10)\",badgeBorder:\"oklch(70% 0.22 10 / 0.4)\"}\n  };\n\n  state = { activeCat:0, activeAc:null, galleryIndex:0, revealedChapters:{} };\n\n  storyRef = React.createRef();\n  chapterRefs = [];\n\n  onScroll = () => {\n    const ac = this.getAc();\n    if(ac && this.storyRef.current && ac.photos && ac.photos.length>=2){\n      const rect = this.storyRef.current.getBoundingClientRect();\n      const vh = window.innerHeight;\n      const scrollable = rect.height - vh;\n      if(scrollable>0){\n        let progress = (-rect.top)/scrollable;\n        progress = Math.max(0, Math.min(0.9999, progress));\n        const total = ac.photos.length;\n        const idx = Math.max(0, Math.min(total-1, Math.floor(progress*total)));\n        if(idx !== this.state.galleryIndex) this.setState({galleryIndex:idx});\n      }\n    }\n    if(this.chapterRefs.length){\n      const vh = window.innerHeight;\n      let toReveal = null;\n      this.chapterRefs.forEach((el,i)=>{\n        if(!el || this.state.revealedChapters[i]) return;\n        const r = el.getBoundingClientRect();\n        if(r.top < vh*0.88){ if(!toReveal) toReveal={}; toReveal[i]=true; }\n      });\n      if(toReveal) this.setState(s=>({revealedChapters:{...s.revealedChapters,...toReveal}}));\n    }\n  };\n\n  getCat(){ return Component.DATA[this.state.activeCat]; }\n  getAc(){ const c=this.getCat(); return this.state.activeAc!=null ? c.acs[this.state.activeAc] : null; }\n\n  selectCat = (i) => { this.setState({activeCat:i, activeAc:null, galleryIndex:0, revealedChapters:{}}); window.scrollTo(0,0); };\n  selectAc = (i) => { this.setState({activeAc:i, galleryIndex:0, revealedChapters:{}}); window.scrollTo(0,0); };\n  stepAc = (delta) => {\n    const cat = this.getCat();\n    const next = this.state.activeAc + delta;\n    if(next<0 || next>=cat.acs.length) return;\n    this.setState({activeAc:next, galleryIndex:0, revealedChapters:{}});\n    window.scrollTo(0,0);\n  };\n  jumpImage = (i) => {\n    const ac = this.getAc();\n    if(!ac) return;\n    const total = ac.photos.length;\n    if(!this.storyRef.current || total<2){ this.setState({galleryIndex:i}); return; }\n    const rect = this.storyRef.current.getBoundingClientRect();\n    const vh = window.innerHeight;\n    const scrollable = rect.height - vh;\n    const progress = i/total;\n    const targetY = window.scrollY + rect.top + progress*scrollable + 2;\n    window.scrollTo({top: Math.max(0,targetY), behavior:'smooth'});\n  };\n  shiftImage = (delta) => {\n    const ac = this.getAc();\n    if(!ac) return;\n    const total = ac.photos.length;\n    const next = Math.max(0, Math.min(total-1, this.state.galleryIndex+delta));\n    this.jumpImage(next);\n  };\n\n  componentDidMount(){\n    window.addEventListener('scroll', this.onScroll, {passive:true});\n  }\n  componentWillUnmount(){\n    window.removeEventListener('scroll', this.onScroll);\n  }\n  componentDidUpdate(prevProps, prevState){\n    if(prevState.activeAc !== this.state.activeAc || prevState.activeCat !== this.state.activeCat){\n      requestAnimationFrame(this.onScroll);\n    }\n  }\n\n  renderVals(){\n    const DATA = Component.DATA;\n    const CLS = Component.CLS_COLORS;\n    const cat = DATA[this.state.activeCat];\n    const ac = this.getAc();\n\n    const categories = DATA.map((c,i)=>{\n      const active = i===this.state.activeCat;\n      return {\n        eyebrow:c.eyebrow,\n        onClick:()=>this.selectCat(i),\n        tabBorder: active?CLS[c.cls].dot:\"transparent\",\n        tabColor: active?\"#ede8df\":\"#5a5752\",\n        dotColor: CLS[c.cls].dot,\n        dotScale: active?\"scale(1.4)\":\"scale(1)\"\n      };\n    });\n\n    const acItems = cat.acs.map((a,i)=>{\n      const active = i===this.state.activeAc;\n      const empty = !a.realisation && !a.justification;\n      return {\n        code:a.code, titre:a.titre,\n        onClick:()=>this.selectAc(i),\n        itemBg: active?\"rgba(255,255,255,.05)\":\"transparent\",\n        itemBorder: active?CLS[cat.cls].dot:\"transparent\",\n        itemColor: active?\"#ede8df\":\"#5a5752\",\n        itemOpacity: empty?0.35:1,\n        numColor: active?\"#ede8df\":\"#5a5752\"\n      };\n    });\n\n    const showWelcome = ac===null;\n    const showAcView = !showWelcome;\n\n    let fields=[], photos=[], hasGallery=false, hasEmptyGallery=false, hasMultiple=false;\n    let storyHeightVh=0, progressPct=0, catBadgeText=\"\", catEyebrow=\"\", acTitre=\"\", acKey=\"\";\n    let badgeBg=\"\", badgeColor=\"\", badgeBorder=\"\", footCount=\"\";\n\n    if(ac){\n      acKey = cat.id+\"-\"+ac.code;\n      acTitre = ac.titre;\n      catBadgeText = ac.code;\n      catEyebrow = cat.eyebrow;\n      badgeBg = CLS[cat.cls].badgeBg; badgeColor = CLS[cat.cls].badgeColor; badgeBorder = CLS[cat.cls].badgeBorder;\n\n      const rawFields = [\n        {label:\"Réalisation choisie\", value:ac.realisation},\n        {label:\"Ma part dans le travail\", value:ac.ma_part},\n        {label:\"En quoi cela illustre l'AC\", value:ac.justification},\n        {label:\"Niveau atteint & progression\", value:ac.argumentation, niveau:ac.niveau_lettre}\n      ].filter(f=> f.label!==\"Ma part dans le travail\" || f.value);\n\n      fields = rawFields.map((f,i)=>{\n        const revealed = !!this.state.revealedChapters[i];\n        const niveauKey = f.niveau ? f.niveau.toLowerCase() : \"\";\n        const niveauColors = niveauKey===\"a\" ? {bg:\"oklch(72% 0.19 150 / 0.18)\",color:\"oklch(86% 0.16 150)\",border:\"oklch(72% 0.19 150 / 0.32)\"}\n          : niveauKey===\"b\" ? {bg:\"oklch(78% 0.16 80 / 0.18)\",color:\"oklch(88% 0.14 80)\",border:\"oklch(78% 0.16 80 / 0.32)\"}\n          : {bg:\"\",color:\"\",border:\"\"};\n        return {\n          label:f.label,\n          displayValue: f.value || \"À compléter prochainement.\",\n          fontStyle: f.value ? \"normal\" : \"italic\",\n          textColor: f.value ? \"#ede8df\" : \"#5a5752\",\n          hasNiveau: !!f.niveau,\n          niveau: f.niveau||\"\",\n          niveauBg: niveauColors.bg, niveauColor: niveauColors.color, niveauBorder: niveauColors.border,\n          opacity: revealed?1:0,\n          transform: revealed?\"translateY(0)\":\"translateY(28px)\",\n          delay: i*80,\n          refFn: (el)=>{ this.chapterRefs[i]=el; }\n        };\n      });\n      this.chapterRefs.length = fields.length;\n\n      const galleryIndex = this.state.galleryIndex;\n      const total = (ac.photos||[]).length;\n      hasGallery = total>=1;\n      hasEmptyGallery = total===0;\n      hasMultiple = total>1;\n      storyHeightVh = total * 100;\n      progressPct = total>1 ? ((galleryIndex+1)/total*100) : 100;\n\n      photos = (ac.photos||[]).map((name,i)=>({\n        slotId: ac.code.replace(/[^a-zA-Z0-9]/g,\"\")+\"-\"+i,\n        src:\"images/\"+name+\".png\",\n        placeholderLabel:name,\n        opacity: i===galleryIndex?1:0,\n        z: i===galleryIndex?2:1,\n        dotColor: i===galleryIndex?\"#fff\":\"rgba(255,255,255,.2)\",\n        dotScale: i===galleryIndex?\"scale(1.35)\":\"scale(1)\",\n        onJump: ()=>this.jumpImage(i)\n      }));\n\n      footCount = (this.state.activeAc+1)+\" / \"+cat.acs.length;\n    }\n\n    return {\n      categories, acItems, showWelcome, showAcView, acKey, acTitre,\n      hasGallery, hasEmptyGallery, hasMultiple, storyHeightVh, progressPct,\n      catBadgeText, catEyebrow, badgeBg, badgeColor, badgeBorder,\n      photos, fields, footCount,\n      storyRef: this.storyRef,\n      prevImage: ()=>this.shiftImage(-1),\n      nextImage: ()=>this.shiftImage(1),\n      prevAc: ()=>this.stepAc(-1),\n      nextAc: ()=>this.stepAc(1),\n      prevOpacity: this.state.activeAc===0 ? 0.15 : 1,\n      prevPointer: this.state.activeAc===0 ? \"none\" : \"auto\",\n      nextOpacity: ac && this.state.activeAc===cat.acs.length-1 ? 0.15 : 1,\n      nextPointer: ac && this.state.activeAc===cat.acs.length-1 ? \"none\" : \"auto\"\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
